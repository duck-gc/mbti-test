name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ========== 1. CI：校验代码质量 ==========
  test:
    name: 静态校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 运行 MBTI 数据完整性校验
        run: npm test

  # ========== 2. CD：发布到 GitHub Pages ==========
  deploy:
    name: 部署到 GitHub Pages
    needs: test          # 校验通过才部署
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 准备发布目录（仅打包需要发布的文件）
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site   # 只发布 index.html，避免暴露源码与文档

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4